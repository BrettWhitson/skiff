[package]
name = "skiff-ui"
version.workspace = true
edition.workspace = true
publish = false
description = "Skiff's from-scratch GUI toolkit: rasterizer, text, widgets, window shell"

[dependencies]
anyhow.workspace = true
arboard = { version = "3.4", default-features = false }
softbuffer = "0.4.6"
winit = "0.30.5"
accesskit = "0.25.2"
accesskit_winit = "0.34.2"
fontdue = "0.9.5"
# Already used by fontdue; read directly for font names and advances.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[dev-dependencies]
# zlib for the PNGs `gen_icons` writes; already in the tree via flate2.
miniz_oxide = "0.9"
