[package]
name = "termax-gui"
version.workspace = true
edition.workspace = true
description = "Desktop GUI front-end for termax"

[[bin]]
name = "termax-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
tokio.workspace = true
tokio-util = "0.7"
vt100.workspace = true
termax-core.workspace = true
termax-ui = { path = "../termax-ui" }

[dev-dependencies]
tempfile = "3.27.0"
termax-testserver = { path = "../termax-testserver" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
