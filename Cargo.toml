[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tui-term = "0.3.4"
vt100 = "0.16"
skiff-core = { path = "crates/skiff-core", version = "0.1.0" }
